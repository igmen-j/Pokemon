<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Team Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Pokémon Team Builder</h1>

    <form id="team-form">
      <div id="slots" class="slots"></div>
      <button type="submit">Analyze Team</button>
    </form>

    <section id="results" hidden>
      <h2>Team</h2>
      <div id="team-list" class="team-list"></div>

      <h2>Defensive Coverage</h2>
      <table>
        <thead>
          <tr>
            <th>Attacking Type</th>
            <th>Weak</th>
            <th>Resist</th>
            <th>Immune</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody id="coverage-body"></tbody>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
