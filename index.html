<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Team Builder</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Pokémon Team Builder</h1>

    <p class="intro">
      Search by Pokémon name or Pokédex number. Choose up to six Pokémon.
    </p>

    <p id="status" role="status">Loading Pokémon…</p>

    <form id="team-form">
      <div id="slots" class="slots"></div>

      <div class="actions">
        <button id="analyze-button" type="submit" disabled>
          Analyze Team
        </button>

        <button id="clear-button" type="button" class="secondary" disabled>
          Clear Team
        </button>
      </div>
    </form>

    <section id="results" hidden aria-labelledby="coverage-title">
      <h2 id="coverage-title">Defensive Coverage</h2>

      <div class="table-scroll">
        <table class="coverage-table">
          <caption class="sr-only">
            Incoming damage multipliers for each team member.
          </caption>

          <thead id="coverage-head"></thead>
          <tbody id="coverage-body"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
